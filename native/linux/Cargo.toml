[package]
name = "clanky-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = "2"

[dependencies]
gtk = "0.18"
libc = "0.2"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-updater = "2.14.1"
tempfile = "3"
tiny_http = "0.12"
