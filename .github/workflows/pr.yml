name: Pull Request

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run tests
        run: bun run test

  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Smoke test dev server
        run: |
          set -e
          bash scripts/pr-smoke.sh \
            --port 3017 \
            --log-file /tmp/clanky-pr-dev-smoke.log \
            --env CLANKY_DISABLE_PASSKEY=1 \
            --env CLANKY_HOST=127.0.0.1 \
            --env CLANKY_PORT=3017 \
            --env "CLANKY_DATA_DIR=$(mktemp -d)" \
            -- bun run dev

      - name: Build binary
        run: bun run build

      - name: Smoke test binary startup
        run: |
          set -e
          rm -f /tmp/clanky-pr-binary-smoke.log
          ./dist/clanky --help > /tmp/clanky-pr-help.log
          grep -q "Usage:" /tmp/clanky-pr-help.log
          if ./dist/clanky > /tmp/clanky-pr-empty.log 2>&1; then
            echo "Plain clanky should print help and exit non-zero"
            cat /tmp/clanky-pr-empty.log
            exit 1
          fi
          grep -q "Usage:" /tmp/clanky-pr-empty.log
          bash scripts/pr-smoke.sh \
            --port 3018 \
            --log-file /tmp/clanky-pr-binary-smoke.log \
            --env CLANKY_DISABLE_PASSKEY=1 \
            --env CLANKY_HOST=127.0.0.1 \
            --env CLANKY_PORT=3018 \
            --env "CLANKY_DATA_DIR=$(mktemp -d)" \
            -- ./dist/clanky serve

      - name: Smoke test Docker image
        run: |
          set -e
          docker build -t clanky-pr-smoke .
          docker run -d --name clanky-pr-smoke -p 3019:8080 \
            -e CLANKY_DISABLE_PASSKEY=1 \
            -e CLANKY_DATA_DIR=/app/data \
            clanky-pr-smoke
          trap 'docker rm -f clanky-pr-smoke 2>/dev/null || true' EXIT

          docker inspect --format='{{range .Config.Env}}{{println .}}{{end}}' clanky-pr-smoke \
            | grep -Fx 'CLANKY_TRUST_PROXY=true'
          docker inspect --format='{{range .Config.Env}}{{println .}}{{end}}' clanky-pr-smoke \
            | grep -Fx 'CLANKY_TRUST_PROXY_HEADERS=proto,host,prefix'
          docker inspect --format='{{range .Config.Env}}{{println .}}{{end}}' clanky-pr-smoke \
            | grep -Fx 'CLANKY_TRUST_PROXY_CHAIN=first'

          for attempt in $(seq 1 45); do
            status=$(docker inspect --format='{{.State.Health.Status}}' clanky-pr-smoke 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "Docker smoke container became unhealthy"
              docker logs clanky-pr-smoke
              exit 1
            fi
            if [ "$attempt" -eq 45 ]; then
              echo "Docker smoke container did not become healthy"
              docker logs clanky-pr-smoke
              exit 1
            fi
            sleep 2
          done

          if ! bash scripts/pr-smoke.sh \
            --check-only \
            --base-url http://127.0.0.1:3019; then
            echo "Docker smoke resource checks failed"
            docker logs clanky-pr-smoke
            exit 1
          fi
