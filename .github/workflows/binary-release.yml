name: Build and Release Binaries

on:
  release:
    types:
      - published

jobs:
  binaries:
    uses: pablozaiden/installer/.github/workflows/reusable-binary-release.yml@0695c07d48844aa9dd9f2d46b67b1dc9f0804b9f # installer v0.0.10
    permissions:
      contents: write
    secrets:
      macos_signing_certificate_base64: ${{ secrets.CLANKY_MACOS_SIGNING_CERT_BASE64 }}
      macos_signing_certificate_password: ${{ secrets.CLANKY_MACOS_SIGNING_CERT_PASSWORD }}
    with:
      install_command: bun install --frozen-lockfile
      prebuild_command: CLANKY_MACOS_SIGNING_SKIP_LOCAL=1 bun run build
      binaries: |
        [
          {
            "name": "clanky",
            "asset_prefix": "clanky",
            "build_command": "CLANKY_MACOS_SIGNING_SKIP_LOCAL=1 bun src/build.ts --target=$BUN_TARGET",
            "output_path": "dist/clanky-$RELEASE_TARGET"
          }
        ]
