name: Build and Release Binaries

on:
  push:
    branches: [main]
  release:
    types:
      - published

jobs:
  metadata:
    if: github.event_name != 'release' || github.event.release.tag_name != 'latest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      apple_configuration: ${{ github.event_name == 'release' && 'Release' || 'Debug' }}
      targets: ${{ steps.release_metadata.outputs.targets }}
      binaries: ${{ steps.release_metadata.outputs.binaries }}
      generate_checksums: ${{ steps.release_metadata.outputs.generate_checksums }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Validate release metadata
        run: bun run release:metadata:check

      - name: Export installer workflow inputs
        id: release_metadata
        run: |
          {
            echo "targets=$(bun scripts/release-metadata.ts installer-targets)"
            echo "binaries=$(bun scripts/release-metadata.ts installer-binaries)"
            echo "generate_checksums=$(bun scripts/release-metadata.ts installer-checksums)"
          } >> "$GITHUB_OUTPUT"

  ios-testflight:
    name: Publish iOS release to internal TestFlight
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    needs: [metadata, publish-apple-apps]
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    concurrency:
      group: ios-testflight-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Archive, verify and publish internal-only iOS build
        env:
          IOS_RELEASE_TAG: ${{ github.event.release.tag_name }}
          IOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.CLANKY_IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.CLANKY_IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.CLANKY_IOS_TESTFLIGHT_PROFILE_BASE64 }}
          IOS_APP_STORE_KEY_P8: ${{ secrets.CLANKY_APPLE_NOTARY_KEY_P8 }}
          IOS_APP_STORE_KEY_ID: ${{ secrets.CLANKY_APPLE_NOTARY_KEY_ID }}
          IOS_APP_STORE_ISSUER_ID: ${{ secrets.CLANKY_APPLE_NOTARY_ISSUER_ID }}
          IOS_TESTFLIGHT_GROUP: ${{ vars.CLANKY_IOS_TESTFLIGHT_GROUP }}
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/ios-testflight.ts "$IOS_RELEASE_TAG" > "$RUNNER_TEMP/ios-testflight-result.json"
          jq -e --arg frontend_version "${IOS_RELEASE_TAG#v}" '
            .frontendVersion == $frontend_version
            and .internalOnly == true and .processingState == "VALID"
            and (.internalBuildState == "READY_FOR_BETA_TESTING" or .internalBuildState == "IN_BETA_TESTING")
            and .configuration == "Release" and .architecture == "arm64"
            and .internalTesterCount > 0
          ' "$RUNNER_TEMP/ios-testflight-result.json" > /dev/null
          jq -r '"### Internal TestFlight\n\n"
            + "iOS " + .version + " (" + .buildNumber + ") is available to **" + .internalGroupName + "**.\n\n"
            + "Bundled frontend: `" + .frontendVersion + "`.\n\n"
            + "Source: `" + .sourceRevision + "`. Internal-only; no external testing or App Store submission."
          ' "$RUNNER_TEMP/ios-testflight-result.json" >> "$GITHUB_STEP_SUMMARY"

  apple-version:
    name: Resolve Apple distribution version
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Read exact published CLI version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            default_branch="$(gh api "repos/$GH_REPO" --jq '.default_branch')"
            head_sha="$(gh api "repos/$GH_REPO/commits/$default_branch" --jq '.sha')"
            if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
              echo "::notice::Skipping superseded Apple main build $GITHUB_SHA."
              exit 0
            fi
            gh release download latest --pattern release.json --dir "$RUNNER_TEMP" --repo "$GH_REPO"
            if ! version="$(jq -er --arg revision "$GITHUB_SHA" '
              select(.schemaVersion == 1 and .channel == "latest" and .revision == $revision)
              | .version | select(type == "string")
            ' "$RUNNER_TEMP/release.json")"; then
              echo "::error::Published latest manifest does not match this source revision." >&2
              exit 1
            fi
          else
            version="${RELEASE_TAG#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid Apple release version: $version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  apple-apps:
    name: Build Apple apps
    needs: [metadata, apple-version]
    if: needs.apple-version.outputs.version != ''
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      signing_certificate_sha1: ${{ steps.macos_signing.outputs.signing_certificate_sha1 }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      APPLE_BUILD_CONFIGURATION: ${{ needs.metadata.outputs.apple_configuration }}
      APPLE_BUILD_VERSION: ${{ needs.apple-version.outputs.version }}
      CLANKY_MACOS_CHANNEL: ${{ github.event_name == 'push' && 'latest' || 'stable' }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Verify Apple build tools
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" != arm64 ]]; then
            echo "::error::Apple app builds require an Apple Silicon runner." >&2
            exit 1
          fi
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set frontend and bundled controller version
        run: |
          bun -e 'const path = "package.json";
          const value = await Bun.file(path).json();
          value.version = process.env.APPLE_BUILD_VERSION;
          await Bun.write(path, JSON.stringify(value, null, 2) + "\n");'

      - name: Build macOS app and bundled controller
        run: bun run build:apple:macos --configuration "$APPLE_BUILD_CONFIGURATION"

      - name: Build unsigned iOS device app
        run: bun run build:apple:ios:device --configuration "$APPLE_BUILD_CONFIGURATION"

      - name: Verify embedded Apple distribution versions
        run: |
          set -euo pipefail
          products="dist/apple/build/Build/Products"
          for web in \
            "$products/$APPLE_BUILD_CONFIGURATION/Clanky.app/Contents/Resources/Web" \
            "$products/$APPLE_BUILD_CONFIGURATION-iphoneos/Clanky.app/Web"; do
            bun scripts/verify-apple-frontend.ts "$web" "$GITHUB_SHA" "$APPLE_BUILD_VERSION"
          done
          controller="$products/$APPLE_BUILD_CONFIGURATION/Clanky.app/Contents/Helpers/clanky"
          if [[ "$("$controller" version)" != "$APPLE_BUILD_VERSION" ]]; then
            echo "::error::Bundled Mac controller does not match the Apple distribution version." >&2
            exit 1
          fi

      - name: Sign and notarize macOS app
        id: macos_signing
        env:
          MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.CLANKY_MACOS_DEVELOPER_ID_CERT_BASE64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.CLANKY_MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          MACOS_NOTARIZATION_KEY_P8: ${{ secrets.CLANKY_APPLE_NOTARY_KEY_P8 }}
          MACOS_NOTARIZATION_KEY_ID: ${{ secrets.CLANKY_APPLE_NOTARY_KEY_ID }}
          MACOS_NOTARIZATION_ISSUER_ID: ${{ secrets.CLANKY_APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          bun scripts/macos-distribution.ts --notarize \
            "dist/apple/build/Build/Products/$APPLE_BUILD_CONFIGURATION/Clanky.app" \
            > "$RUNNER_TEMP/apple-macos-signing.json"
          jq -e '.distributionSigned == true and .notarized == true and .stapled == true
            and (.signingCertificateSHA1 | test("^[A-F0-9]{40}$"))
            and (.teamId | test("^[A-Z0-9]{10}$"))
            and (.notarizationSubmissionId | type == "string" and length > 0)
          ' "$RUNNER_TEMP/apple-macos-signing.json" > /dev/null
          echo "signing_certificate_sha1=$(jq -r .signingCertificateSHA1 "$RUNNER_TEMP/apple-macos-signing.json")" >> "$GITHUB_OUTPUT"

      - name: Archive Apple apps
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version)"
          for platform in macos ios; do
            case "$platform" in
              macos) product="$APPLE_BUILD_CONFIGURATION"; sdk=MacOSX; executable=Contents/MacOS/Clanky; plist=Contents/Info.plist ;;
              ios) product="$APPLE_BUILD_CONFIGURATION-iphoneos"; sdk=iPhoneOS; executable=Clanky; plist=Info.plist ;;
            esac
            root="dist/apple/build/Build/Products/$product"
            app="$root/Clanky.app"
            if [[ ! -d "$app" ]]; then
              echo "::error::Missing $platform app: $app" >&2
              exit 1
            fi
            /usr/bin/lipo -verify_arch arm64 "$app/$executable"
            actual_sdk="$(/usr/bin/plutil -extract CFBundleSupportedPlatforms.0 raw -o - "$app/$plist")"
            if [[ "$actual_sdk" != "$sdk" ]]; then
              echo "::error::Expected $sdk app, got $actual_sdk." >&2
              exit 1
            fi
            if [[ "$platform" == macos ]]; then
              /usr/bin/lipo -verify_arch arm64 "$app/Contents/Helpers/clanky"
            else
              bun scripts/verify-ios-settings.ts "$app"
            fi
            output="$RUNNER_TEMP/apple-apps/$platform"
            mkdir -p "$output"
            if [[ "$platform" == macos ]]; then
              archive="Clanky-macos-arm64-notarized.zip"
              ditto -c -k --keepParent "$app" "$output/$archive"
            else
              archive="Clanky-ios-arm64-unsigned.tar.gz"
              COPYFILE_DISABLE=1 tar -czf "$output/$archive" -C "$root" Clanky.app
            fi
            (
              cd "$output"
              shasum -a 256 "$archive" > "$archive.sha256"
            )
            jq -n \
              --arg revision "$GITHUB_SHA" \
              --arg ref "$GITHUB_REF" \
              --arg platform "$platform" \
              --arg archive "$archive" \
              --arg xcode "$xcode_version" \
              --arg configuration "$APPLE_BUILD_CONFIGURATION" \
              --arg version "$APPLE_BUILD_VERSION" \
              --slurpfile signing "$RUNNER_TEMP/apple-macos-signing.json" \
              '{sourceRevision: $revision, sourceRef: $ref, platform: $platform,
                architecture: "arm64", configuration: $configuration, version: $version, archive: $archive,
                distributionSigned: ($platform == "macos"), notarized: ($platform == "macos"), xcode: $xcode}
                + (if $platform == "macos" then {
                    signingCertificateSHA1: $signing[0].signingCertificateSHA1,
                    teamId: $signing[0].teamId,
                    notarizationSubmissionId: $signing[0].notarizationSubmissionId,
                    stapled: $signing[0].stapled
                  } else {} end)' \
              > "$output/build.json"
          done

      - name: Generate signed Mac update appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.CLANKY_SPARKLE_PRIVATE_KEY }}
        run: |
          bun scripts/macos-appcast.ts \
            "$RUNNER_TEMP/apple-apps/macos/Clanky-macos-arm64-notarized.zip" \
            "$RUNNER_TEMP/apple-apps/macos"

      - name: Upload macOS app build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-app-macos-arm64
          path: ${{ runner.temp }}/apple-apps/macos/*
          if-no-files-found: error
          compression-level: 0

      - name: Upload iOS device app build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-app-ios-arm64
          path: ${{ runner.temp }}/apple-apps/ios/*
          if-no-files-found: error
          compression-level: 0

  binaries:
    needs: metadata
    uses: pablozaiden/installer/.github/workflows/reusable-binary-release.yml@a60b4b71e8add6dcdf1aa89f71f132b742c326e7
    permissions:
      contents: write
    secrets:
      macos_signing_certificate_base64: ${{ secrets.CLANKY_MACOS_DEVELOPER_ID_CERT_BASE64 }}
      macos_signing_certificate_password: ${{ secrets.CLANKY_MACOS_DEVELOPER_ID_CERT_PASSWORD }}
      macos_notarization_key_p8: ${{ secrets.CLANKY_APPLE_NOTARY_KEY_P8 }}
      macos_notarization_key_id: ${{ secrets.CLANKY_APPLE_NOTARY_KEY_ID }}
      macos_notarization_issuer_id: ${{ secrets.CLANKY_APPLE_NOTARY_ISSUER_ID }}
    with:
      release_channel: ${{ github.event_name == 'push' && 'latest' || 'stable' }}
      install_command: bun install --frozen-lockfile
      prebuild_command: bun run build
      macos_finalize_command: bun scripts/macos-distribution.ts --notarize
      targets: ${{ needs.metadata.outputs.targets }}
      binaries: ${{ needs.metadata.outputs.binaries }}
      generate_checksums: ${{ needs.metadata.outputs.generate_checksums == 'true' }}

  publish-apple-apps:
    name: Publish Apple app assets
    needs: [metadata, apple-version, apple-apps, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: binary-release-${{ github.repository }}-${{ github.event_name == 'push' && 'latest' || 'stable' }}
      cancel-in-progress: false
      queue: max

    steps:
      - name: Checkout exact publication tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install publication dependencies
        run: bun install --frozen-lockfile

      - name: Download macOS app build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apple-app-macos-arm64
          path: ${{ runner.temp }}/apple-release-inputs/macos

      - name: Download iOS device app build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apple-app-ios-arm64
          path: ${{ runner.temp }}/apple-release-inputs/ios

      - name: Validate and publish Apple app assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'push' && 'latest' || github.event.release.tag_name }}
          APPLE_BUILD_CONFIGURATION: ${{ needs.metadata.outputs.apple_configuration }}
          APPLE_BUILD_VERSION: ${{ needs.apple-version.outputs.version }}
          MACOS_SIGNING_CERTIFICATE_SHA1: ${{ needs.apple-apps.outputs.signing_certificate_sha1 }}
          CLANKY_MACOS_CHANNEL: ${{ github.event_name == 'push' && 'latest' || 'stable' }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/apple-release-assets"
          mkdir -p "$output"

          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            default_branch="$(gh api "repos/$GH_REPO" --jq '.default_branch')"
            head_sha="$(gh api "repos/$GH_REPO/commits/$default_branch" --jq '.sha')"
            if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
              echo "::notice::Skipping superseded Apple main build $GITHUB_SHA."
              exit 0
            fi
            gh release download latest --pattern release.json --dir "$output" --repo "$GH_REPO"
            if ! version="$(jq -er --arg revision "$GITHUB_SHA" '
              select(.schemaVersion == 1 and .channel == "latest" and .revision == $revision)
              | .version | select(type == "string")
            ' "$output/release.json")"; then
              echo "::error::Published latest manifest does not match this source revision." >&2
              exit 1
            fi
          else
            version="${RELEASE_TAG#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid Apple release version: $version." >&2
            exit 1
          fi
          if [[ "$version" != "$APPLE_BUILD_VERSION" ]]; then
            echo "::error::Published CLI version does not match the embedded Apple build version." >&2
            exit 1
          fi

          assets=()
          for platform in macos ios; do
            input="$RUNNER_TEMP/apple-release-inputs/$platform"
            if [[ "$platform" == macos ]]; then
              suffix=notarized.zip
            else
              suffix=unsigned.tar.gz
            fi
            archive="Clanky-$platform-arm64-$suffix"
            if ! jq -e --arg revision "$GITHUB_SHA" --arg ref "$GITHUB_REF" \
              --arg platform "$platform" --arg archive "$archive" \
              --arg signer "$MACOS_SIGNING_CERTIFICATE_SHA1" \
              --arg configuration "$APPLE_BUILD_CONFIGURATION" --arg version "$version" '
              .sourceRevision == $revision and .sourceRef == $ref
              and .platform == $platform and .architecture == "arm64"
              and .version == $version
              and .configuration == $configuration and .archive == $archive
              and (if $platform == "macos" then
                .distributionSigned == true and .notarized == true and .stapled == true
                and .signingCertificateSHA1 == $signer and ($signer | test("^[A-F0-9]{40}$"))
                and (.teamId | type == "string" and test("^[A-Z0-9]{10}$"))
                and (.notarizationSubmissionId | type == "string" and length > 0)
              else .distributionSigned == false and .notarized == false end)
              and (.xcode | type == "string" and length > 0)
            ' "$input/build.json" > /dev/null; then
              echo "::error::Invalid $platform app metadata for $GITHUB_SHA." >&2
              exit 1
            fi
            if ! (
              cd "$input"
              sha256sum "$archive" | diff - "$archive.sha256"
            ); then
              echo "::error::Invalid $platform app archive checksum." >&2
              exit 1
            fi

            name="Clanky-v$version-$platform-arm64-$suffix"
            metadata="Clanky-v$version-$platform-arm64-build.json"
            cp "$input/$archive" "$output/$name"
            (
              cd "$output"
              sha256sum "$name" > "$name.sha256"
            )
            jq --arg archive "$name" \
              '. + {archive: $archive}' "$input/build.json" \
              > "$output/$metadata"
            assets+=("$output/$name" "$output/$name.sha256" "$output/$metadata")
          done

          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            head_sha="$(gh api "repos/$GH_REPO/commits/$default_branch" --jq '.sha')"
            if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
              echo "::notice::Skipping superseded Apple main build $GITHUB_SHA."
              exit 0
            fi
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GH_REPO"
          prefix="Clanky-v$version-macos-arm64"
          cp "$RUNNER_TEMP/apple-release-inputs/macos/appcast.xml" "$output/$prefix-appcast.xml"
          cp "$RUNNER_TEMP/apple-release-inputs/macos/update.json" "$output/$prefix-update.json"
          bun -e '
            const { updateMetadata, sha256, readAppcast } = await import("./scripts/macos-update-metadata");
            const { macOSBuildSettings } = await import("./scripts/sparkle");
            const root = process.env.RUNNER_TEMP + "/apple-release-inputs/macos";
            const metadata = updateMetadata.parse(await Bun.file(root + "/update.json").json());
            const xml = await Bun.file(root + "/appcast.xml").text();
            const item = readAppcast(xml);
            const archive = await Bun.file(root + "/Clanky-macos-arm64-notarized.zip").arrayBuffer();
            const channel = process.env.RELEASE_TAG === "latest" ? "latest" : "stable";
            if (metadata.version !== process.env.APPLE_BUILD_VERSION
              || metadata.revision !== process.env.GITHUB_SHA || metadata.channel !== channel
              || metadata.buildNumber !== macOSBuildSettings().CURRENT_PROJECT_VERSION
              || metadata.sha256 !== sha256(archive) || metadata.bytes !== archive.byteLength
              || metadata.appcastSha256 !== sha256(xml) || item.buildNumber !== metadata.buildNumber)
              throw new Error("Mac update metadata does not match the published build.");
          '
          gh release upload "$RELEASE_TAG" "$output/$prefix-appcast.xml" --clobber --repo "$GH_REPO"
          # Publish readiness only after the archive and appcast are uploaded.
          gh release upload "$RELEASE_TAG" "$output/$prefix-update.json" --clobber --repo "$GH_REPO"
          for file in "$output/$prefix-notarized.zip" "$output/$prefix-appcast.xml" "$output/$prefix-update.json"; do
            expected="sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
            actual="$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" \
              --jq ".assets[] | select(.name == \"$(basename "$file")\") | .digest")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Uploaded Mac update asset digest mismatch." >&2
              exit 1
            fi
          done

      - name: Publish completed Mac update feeds through Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
