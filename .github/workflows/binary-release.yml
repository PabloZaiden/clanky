name: Build and Release Binaries

on:
  release:
    types:
      - published

jobs:
  binaries:
    uses: pablozaiden/installer/.github/workflows/reusable-binary-release.yml@1e73c9a4b84bb2282d5a6fd8463f9a9f62c26c67 # installer v0.1.0
    permissions:
      contents: write
    secrets:
      macos_signing_certificate_base64: ${{ secrets.CLANKY_MACOS_SIGNING_CERT_BASE64 }}
      macos_signing_certificate_password: ${{ secrets.CLANKY_MACOS_SIGNING_CERT_PASSWORD }}
    with:
      install_command: bun install --frozen-lockfile
      prebuild_command: bun run build
      binaries: |
        [
          {
            "name": "clanky",
            "asset_prefix": "clanky",
            "build_command": "bun src/build.ts --target=$BUN_TARGET",
            "output_path": "dist/clanky-$RELEASE_TARGET"
          }
        ]
