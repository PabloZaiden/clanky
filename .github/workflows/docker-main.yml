name: Build and Push Docker Image (Main Branch)

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Toggle platforms: 'linux/amd64' for fast builds, 'linux/amd64,linux/arm64' for full cross-build
  BUILD_PLATFORMS: linux/amd64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve build version
        uses: pablozaiden/installer/.github/actions/resolve-version@d65a93c1af0d7ce62524d6ccdfee44d0f6ceac4e # installer #7
        with:
          mode: main
          github_token: ${{ github.token }}
          update_package_version: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ env.BUILD_PLATFORMS }}

      - name: Test container healthcheck
        run: |
          # Run the container in the background
          docker run -d --name clanky-test -p 8080:8080 ${{ steps.meta.outputs.tags }}

          # The production image is intended for reverse-proxy deployments.
          docker inspect --format='{{range .Config.Env}}{{println .}}{{end}}' clanky-test \
            | grep -Fx 'CLANKY_TRUST_PROXY=true'
          docker inspect --format='{{range .Config.Env}}{{println .}}{{end}}' clanky-test \
            | grep -Fx 'CLANKY_TRUST_PROXY_HEADERS=proto,host,prefix'
          docker inspect --format='{{range .Config.Env}}{{println .}}{{end}}' clanky-test \
            | grep -Fx 'CLANKY_TRUST_PROXY_CHAIN=first'

          # Wait for the container to be ready and healthy
          echo "Waiting for container to become healthy..."
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' clanky-test 2>/dev/null || echo "starting")
            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy!"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Container failed to become healthy within 60s"
              echo "Container status: $STATUS"
              echo "Container logs:"
              docker logs clanky-test
              docker rm -f clanky-test
              exit 1
            fi
            sleep 2
          done

          # Verify the health endpoint directly
          curl -f http://localhost:8080/api/health

          # Cleanup
          docker rm -f clanky-test
