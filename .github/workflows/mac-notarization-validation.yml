name: Disposable Mac runtime replay
'on':
  push:
    branches:
    - mac-release-notarization
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: xcode-27
          mode: app
        - runner: xcode-27
          mode: cli
        - runner: macos-15-intel
          mode: cli
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Download accepted CLI binaries
      if: matrix.mode == 'cli'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-assets-0
        run-id: 42498171931
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/release-assets
    - name: Download actual CLI signing receipt
      if: matrix.mode == 'cli'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: mac-cli-signing-evidence
        run-id: 42498171931
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}
    - name: Download accepted stapled app
      if: matrix.mode == 'app'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: apple-app-macos-arm64
        run-id: 42498171931
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/apple-apps/macos
    - name: Bind original app metadata to actual Apple receipt
      if: matrix.mode == 'app'
      run: 'python3 - <<''PY''

        import json, os

        from pathlib import Path

        root = Path(os.environ["RUNNER_TEMP"])

        metadata = json.loads((root / "apple-apps/macos/build.json").read_text())

        log = json.loads(Path(".github/mac-accepted-notary-log.json").read_text())

        assert log["status"] == "Accepted" and metadata["notarizationSubmissionId"] == log["jobId"]

        original = "submission.zip/Clanky.app"

        metadata.update(artifacts=[original], codeDirectoryHashes={row["path"]: row["cdhash"] for row in log["ticketContents"]})

        (root / "apple-macos-signing.json").write_text(json.dumps(metadata))

        PY

        '
    - name: Verify exact archived signed code and actual runtime
      run: python3 .github/mac-notarization-runtime.py "${{ matrix.mode }}" "$RUNNER_TEMP" "$RUNNER_TEMP/runtime.json"
    - name: Save successful runtime verification
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: runtime-${{ matrix.mode }}-${{ matrix.runner }}
        path: ${{ runner.temp }}/runtime.json
        if-no-files-found: error
