name: Build and Push Docker Image

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Resolve release metadata
        id: release_metadata
        run: |
          set -euo pipefail
          bun run release:metadata:check
          echo "config=$(bun scripts/release-metadata.ts docker-config release)" >> "$GITHUB_OUTPUT"

      - name: Resolve release version
        id: version
        uses: pablozaiden/installer/.github/actions/resolve-version@d65a93c1af0d7ce62524d6ccdfee44d0f6ceac4e # installer #7
        with:
          mode: release
          update_package_version: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract server metadata (tags, labels)
        id: meta_server
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ fromJSON(steps.release_metadata.outputs.config).images.server.name }}
          tags: ${{ fromJSON(steps.release_metadata.outputs.config).tags }}

      - name: Extract relay metadata (tags, labels)
        id: meta_relay
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ fromJSON(steps.release_metadata.outputs.config).images.relay.name }}
          tags: ${{ fromJSON(steps.release_metadata.outputs.config).tags }}

      - name: Build and push server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: ${{ fromJSON(steps.release_metadata.outputs.config).images.server.dockerfileTarget }}
          push: true
          tags: ${{ steps.meta_server.outputs.tags }}
          labels: ${{ steps.meta_server.outputs.labels }}
          build-args: |
            CLANKY_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=clanky
          cache-to: type=gha,mode=max,scope=clanky
          platforms: ${{ fromJSON(steps.release_metadata.outputs.config).platforms }}

      - name: Build and push relay image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: ${{ fromJSON(steps.release_metadata.outputs.config).images.relay.dockerfileTarget }}
          push: true
          tags: ${{ steps.meta_relay.outputs.tags }}
          labels: ${{ steps.meta_relay.outputs.labels }}
          build-args: |
            CLANKY_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=clanky
          platforms: ${{ fromJSON(steps.release_metadata.outputs.config).platforms }}
