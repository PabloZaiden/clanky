name: Build and Push Docker Image

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Resolve release metadata
        id: release_metadata
        run: |
          set -euo pipefail
          bun run release:metadata:check
          echo "config=$(bun scripts/release-metadata.ts docker-config release)" >> "$GITHUB_OUTPUT"

      - name: Resolve release version
        id: version
        uses: pablozaiden/installer/.github/actions/resolve-version@b30e7af9e43cd41f8511d555e06ea60d066c4e9f
        with:
          mode: release
          update_package_version: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract server metadata (tags, labels)
        id: meta_server
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ fromJSON(steps.release_metadata.outputs.config).images.server.name }}
          tags: ${{ fromJSON(steps.release_metadata.outputs.config).tags }}

      - name: Extract relay metadata (tags, labels)
        id: meta_relay
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ fromJSON(steps.release_metadata.outputs.config).images.relay.name }}
          tags: ${{ fromJSON(steps.release_metadata.outputs.config).tags }}

      - name: Build and push server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: ${{ fromJSON(steps.release_metadata.outputs.config).images.server.dockerfileTarget }}
          push: true
          tags: ${{ steps.meta_server.outputs.tags }}
          labels: ${{ steps.meta_server.outputs.labels }}
          build-args: |
            CLANKY_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=clanky
          cache-to: type=gha,mode=max,scope=clanky
          platforms: ${{ fromJSON(steps.release_metadata.outputs.config).platforms }}

      - name: Build and push relay image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: ${{ fromJSON(steps.release_metadata.outputs.config).images.relay.dockerfileTarget }}
          push: true
          tags: ${{ steps.meta_relay.outputs.tags }}
          labels: ${{ steps.meta_relay.outputs.labels }}
          build-args: |
            CLANKY_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=clanky
          platforms: ${{ fromJSON(steps.release_metadata.outputs.config).platforms }}
