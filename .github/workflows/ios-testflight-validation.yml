name: Disposable first internal TestFlight upload

on:
  push:
    branches: [ios-testflight-first-upload]

jobs:
  validate:
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    concurrency:
      group: ios-testflight-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - name: Checkout existing stable v9.2.0 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 11c557413d454c3d2090d54309521ac778344c59

      - name: Checkout candidate publication tooling separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .clanky-testflight-tools

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install existing stable dependencies
        run: bun install --frozen-lockfile

      - name: Publish the first real internal build without creating a GitHub release
        env:
          IOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.CLANKY_IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.CLANKY_IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.CLANKY_IOS_TESTFLIGHT_PROFILE_BASE64 }}
          IOS_APP_STORE_KEY_P8: ${{ secrets.CLANKY_APPLE_NOTARY_KEY_P8 }}
          IOS_APP_STORE_KEY_ID: ${{ secrets.CLANKY_APPLE_NOTARY_KEY_ID }}
          IOS_APP_STORE_ISSUER_ID: ${{ secrets.CLANKY_APPLE_NOTARY_ISSUER_ID }}
          IOS_TESTFLIGHT_GROUP: ${{ vars.CLANKY_IOS_TESTFLIGHT_GROUP }}
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_SHA=11c557413d454c3d2090d54309521ac778344c59
          export GITHUB_REF=refs/tags/v9.2.0 GITHUB_REF_NAME=v9.2.0 GITHUB_REF_TYPE=tag
          export GITHUB_EVENT_NAME=release
          bun .clanky-testflight-tools/scripts/ios-testflight.ts v9.2.0 > "$RUNNER_TEMP/ios-testflight-result.json"
          jq -e '.sourceRevision == "11c557413d454c3d2090d54309521ac778344c59"
            and .version == "9.2.0" and .internalOnly == true and .processingState == "VALID"
            and (.internalBuildState == "READY_FOR_BETA_TESTING" or .internalBuildState == "IN_BETA_TESTING")
            and .internalTesterCount == 1
          ' "$RUNNER_TEMP/ios-testflight-result.json" > /dev/null
          jq . "$RUNNER_TEMP/ios-testflight-result.json"

      - name: Save non-secret processed-build receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testflight-v9.2.0-validation
          path: ${{ runner.temp }}/ios-testflight-result.json
          if-no-files-found: error
