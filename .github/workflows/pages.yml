name: Publish browser clients

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    pages-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
      || (github.event_name != 'release' && github.ref == 'refs/heads/main' && 'publication')
      || format('skipped-{0}', github.run_id)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dispatch-release:
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Publish release channels through main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    if: github.event_name == 'pull_request' || (github.event_name != 'release' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.sources.outputs.sources }}
      snapshots: ${{ steps.snapshots.outputs.snapshots }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Select immutable channel sources
        id: sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sources="$(bun scripts/pages-sources.ts "$(git rev-parse HEAD)")"
          {
            echo "sources=$sources"
            echo "stable_revision=$(jq -r .stable.revision <<< "$sources")"
            echo "stable_tag=$(jq -r .stable.tag <<< "$sources")"
            echo "latest_revision=$(jq -r .latest.revision <<< "$sources")"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve latest client build version
        uses: pablozaiden/installer/.github/actions/resolve-version@b30e7af9e43cd41f8511d555e06ea60d066c4e9f
        env:
          SHORT_SHA: ${{ steps.sources.outputs.latest_revision }}
        with:
          mode: main
          latest_release_tag: ${{ steps.sources.outputs.stable_tag }}
          github_token: ${{ github.token }}
          update_package_version: true

      - name: Typecheck
        run: bun run typecheck

      - name: Build latest client snapshot
        run: GITHUB_SHA="$(git rev-parse HEAD)" bun run build:pages

      - name: Save latest snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          cp -R dist/pages "$RUNNER_TEMP/pages/latest"

      - name: Checkout stable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.sources.outputs.stable_revision }}
          path: dist/pages-stable-source

      - name: Install stable release dependencies
        working-directory: dist/pages-stable-source
        run: bun install --frozen-lockfile

      - name: Resolve stable client build version
        uses: pablozaiden/installer/.github/actions/resolve-version@b30e7af9e43cd41f8511d555e06ea60d066c4e9f
        with:
          mode: release
          release_tag: ${{ steps.sources.outputs.stable_tag }}
          package_json: dist/pages-stable-source/package.json
          update_package_version: true

      - name: Build stable client snapshot
        working-directory: dist/pages-stable-source
        run: GITHUB_SHA="$(git rev-parse HEAD)" bun run build:pages

      - name: Assemble both channels
        id: snapshots
        env:
          SELECTED_SOURCES: ${{ steps.sources.outputs.sources }}
        run: |
          set -euo pipefail
          bun scripts/assemble-pages.ts dist/pages-stable-source/dist/pages "$RUNNER_TEMP/pages/latest"
          snapshots="$(jq -cn \
            --slurpfile stable dist/pages/stable/build-info.json \
            --slurpfile latest dist/pages/latest/build-info.json \
            '{stable: $stable[0], latest: $latest[0]}')"
          jq -e --argjson sources "$SELECTED_SOURCES" '
            .stable.revision == $sources.stable.revision
            and .stable.version == $sources.stable.version
            and .latest.revision == $sources.latest.revision
          ' <<< "$snapshots"
          echo "snapshots=$snapshots" >> "$GITHUB_OUTPUT"

      - name: Upload browser client snapshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-clients
          path: dist/pages
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.event_name != 'release' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.build.outputs.sources).latest.revision }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install publication dependencies
        run: bun install --frozen-lockfile

      - name: Check current channel sources
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_SOURCES: ${{ needs.build.outputs.sources }}
        run: |
          set -euo pipefail
          current="$(bun scripts/pages-sources.ts)"
          if [ "$current" != "$SELECTED_SOURCES" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping superseded frontend channel sources."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.revision.outputs.publish == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Download browser client snapshots
        if: steps.revision.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-clients
          path: dist/pages

      - name: Add completed Mac update feeds
        if: steps.revision.outputs.publish == 'true'
        id: macos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          feeds="$(bun scripts/macos-pages-feeds.ts dist/pages)"
          echo "feeds=$feeds" >> "$GITHUB_OUTPUT"

      - name: Upload complete Pages artifact
        if: steps.revision.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/pages

      - name: Deploy stable and latest channels
        id: deployment
        if: steps.revision.outputs.publish == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Verify published channels
        if: steps.revision.outputs.publish == 'true'
        env:
          EXPECTED_SNAPSHOTS: ${{ needs.build.outputs.snapshots }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_MACOS_FEEDS: ${{ steps.macos.outputs.feeds }}
        run: bun scripts/verify-pages.ts "$PAGE_URL"
